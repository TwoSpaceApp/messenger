# Nginx configuration for TwoSpace Web
# Location: /etc/nginx/sites-available/twospace
# Enable with: sudo ln -sf /etc/nginx/sites-available/twospace /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name web.twospace.ru;

    # Allow certbot verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.twospace.ru;

    # SSL certificates (generated by certbot)
    ssl_certificate /etc/letsencrypt/live/web.twospace.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.twospace.ru/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root directory for the Flutter web build
    root /var/www/twospace-web;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Cache policy for static assets
    location ~* \.(wasm|js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache busting for main app bundle (fingerprinted files)
    location ~ "\.([a-f0-9]+)\.(js|css)$" {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for index.html and manifest.json
    location ~ "^/(index\.html|manifest\.json|service-worker\.js)$" {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA routing: route all non-existent paths back to index.html
    # This allows Flutter Router to handle routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access to common sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Performance logging (optional)
    access_log /var/log/nginx/twospace-access.log;
    error_log /var/log/nginx/twospace-error.log;
}
