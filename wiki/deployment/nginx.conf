# TwoSpace Web Application with WebSocket Support
# This configuration serves the Flutter web app and proxies WebSocket to the proxy server

# Upstream for WebSocket proxy
upstream websocket_backend {
    server localhost:9999;
}

server {
    server_name web.twospace.ru;
    root /var/www/web.twospace.ru;
    index index.html;

    # Main app routing - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML files - no cache
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # WebSocket proxy to Aegis via our proxy service
    location /ws {
        # Require WebSocket upgrade
        proxy_pass http://websocket_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for long-lived connections
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
        
        # Error page
        error_page 502 /ws-error.html;
    }

    # Error page fallback
    error_page 404 /index.html;
    
    # SSL certificates (managed by Certbot)
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/web.twospace.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.twospace.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name web.twospace.ru;
    return 301 https://$host$request_uri;
}
