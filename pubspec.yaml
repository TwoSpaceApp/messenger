name: two_space_app
description: "A secure and feature-rich messenger."
publish_to: 'none'
version: 2.0.8-beta+67

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # New libs
  animations: ^2.0.0
  sensors_plus: ^7.0.0
  flutter_contacts: ^2.0.1
  crypto: ^3.0.3
  cryptography: ^2.7.0
  pointycastle: ^4.0.0
  msgpack_dart: ^1.0.1
  es_compression: ^2.0.15

  # ===== State Management =====
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.3
  riverpod: ^3.0.3

  # ===== Logging =====
  logger: ^2.4.0

  # ===== Security =====
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.0

  # ===== UI & Theming =====
  google_fonts: ^8.0.2
  envied: ^1.1.0
  envied_generator: ^1.1.0
  emoji_picker_flutter: ^4.4.0
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  shadcn_ui: ^0.53.3

  # ===== File & Path =====
  file_picker: ^10.3.10
  desktop_drop: ^0.7.0
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  image: ^4.1.0

  # ===== Networking & API =====
  dio: ^5.5.0+1
  connectivity_plus: ^7.0.0

  # ===== Database =====
  sqflite: ^2.3.3+1
  drift: ^2.31.0
  drift_sqflite: ^2.0.1
  sqlite3: ^2.9.4

  # ===== Media =====
  audioplayers: ^6.1.0
  camera: ^0.12.0+1
  video_player: ^2.11.0
  video_thumbnail: ^0.5.6

  # ===== Notifications =====
  flutter_local_notifications: ^17.0.0

  # ===== Connectivity =====
  url_launcher: ^6.3.1

  # ===== Utilities =====
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0
  app_links: ^7.0.0
  flutter_displaymode: ^0.7.0
  path: ^1.9.0
  shimmer: ^3.0.0
  share_plus: ^12.0.2
  record: ^6.2.0
  go_router: ^17.1.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  open_filex: ^4.7.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.1.0
  build_runner: ^2.4.14
  riverpod_generator: ^3.0.3
  drift_dev: ^2.31.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^3.3.0
  json_serializable: ^7.0.0
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"
