name: two_space_app
description: "A secure and feature-rich messenger for the TwoSpace ecosystem."
publish_to: 'none'
version: 0.1.6+12

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # New libs
  animations: ^2.0.0
  sensors_plus: ^7.0.0
  flutter_contacts: ^1.1.9
  crypto: ^3.0.3

  # ===== State Management =====
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.3
  riverpod: ^3.0.3

  # ===== Monitoring & Error Tracking =====
  sentry_flutter: ^9.14.0
  logger: ^2.4.0

  # ===== Security =====
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.0

  # ===== UI & Theming =====
  google_fonts: ^8.0.2
  flutter_dotenv: ^6.0.0
  emoji_picker_flutter: ^4.4.0
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0

  # ===== File & Path =====
  file_picker: ^10.3.10
  path_provider: ^2.1.3
  image_picker: ^1.1.2

  # ===== Networking & API =====
  http: ^1.2.1
  dio: ^5.5.0+1
  connectivity_plus: ^7.0.0

  # ===== Database =====
  sqflite: ^2.3.3+1
  drift: ^2.31.0

  # ===== Media =====
  audioplayers: ^6.1.0
  video_player: ^2.11.0

  # ===== Connectivity =====
  url_launcher: ^6.3.1

  # ===== Utilities =====
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0
  app_links: ^7.0.0
  flutter_displaymode: ^0.7.0
  path: ^1.9.0
  shimmer: ^3.0.0
  share_plus: ^12.0.1
  record: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.3
  drift_dev: ^2.31.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env.example
    - assets/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
