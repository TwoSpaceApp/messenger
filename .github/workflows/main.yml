name: Flutter CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.env.example'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - '.github/workflows/main.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.env.example'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - '.github/workflows/main.yml'
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare CI env
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Regenerate code
        run: dart build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded
