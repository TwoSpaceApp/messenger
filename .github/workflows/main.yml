name: Minimal Flutter CI

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.env.example'
      - '.github/workflows/main.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.env.example'
      - '.github/workflows/main.yml'

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'

      - name: Get dependencies
        run: flutter pub get

      - name: Get dependencies V2
        run: flutter pub get --enforce-lockfile

      - name: Codegen (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare env for CI
        shell: bash
        run: |
          cat > .env <<EOF
          ENABLE_DEV_TOOLS=false
          APP_ENV=development
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          AEGIS_HOST=${{ secrets.AEGIS_HOST }}
          AEGIS_PORT=8888
          AEGIS_CONNECT_TIMEOUT_SECONDS=10
          AEGIS_TRANSPORT_MASKING_KEY=${{ secrets.AEGIS_TRANSPORT_MASKING_KEY }}
          EOF

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true
