name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: release
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.env.example'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - 'setup.iss'
      - '.github/workflows/build-desktop.yml'

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine build mode
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            build_mode="${{ inputs.build_mode }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && ( "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ) ]]; then
            build_mode="release"
          else
            build_mode="debug"
          fi

          echo "build_mode=${build_mode}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            zlib1g-dev \
            libunwind-dev \
            libcurl4-openssl-dev \
            libc-ares-dev \
            libssl-dev \
            libgtk-3-dev \
            libsecret-1-dev \
            libasound2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            liblzma-dev

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Enable Linux desktop
        if: matrix.platform == 'linux'
        run: flutter config --enable-linux-desktop

      - name: Enable Windows desktop
        if: matrix.platform == 'windows'
        run: flutter config --enable-windows-desktop

      - name: Prepare validation env
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get && apt install libgtk-3-dev && apt install mesa-utils

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Regenerate code
        run: 
          flutter pub upgrade build_runner
          rm -rf .dart_tool/build/
          dart run build_runner build --delete-conflicting-outputs

      - name: Prepare build env from GitHub secrets
        shell: bash
        env:
          APP_ENV_VALUE: ${{ secrets.APP_ENV }}
          ENABLE_DEV_TOOLS_VALUE: ${{ secrets.ENABLE_DEV_TOOLS }}
          AEGIS_HOST_VALUE: ${{ secrets.AEGIS_HOST }}
          AEGIS_PORT_VALUE: ${{ secrets.AEGIS_PORT }}
          AEGIS_CONNECT_TIMEOUT_SECONDS_VALUE: ${{ secrets.AEGIS_CONNECT_TIMEOUT_SECONDS }}
          AEGIS_TRANSPORT_MASKING_KEY_VALUE: ${{ secrets.AEGIS_TRANSPORT_MASKING_KEY }}
          AEGIS_USE_TLS_VALUE: ${{ secrets.AEGIS_USE_TLS }}
          AEGIS_APP_ID_VALUE: ${{ secrets.AEGIS_APP_ID }}
          AEGIS_APP_HASH_VALUE: ${{ secrets.AEGIS_APP_HASH }}
        run: |
          if [[ -z "${AEGIS_HOST_VALUE}" ]]; then
            echo "::error::AEGIS_HOST secret is missing or unavailable for this workflow event. Desktop build artifacts are only produced for push/workflow_dispatch runs with repository secrets access."
            exit 1
          fi

          if [[ "${{ steps.meta.outputs.build_mode }}" == "debug" ]]; then
            enable_dev_tools="true"
          else
            enable_dev_tools="${ENABLE_DEV_TOOLS_VALUE:-false}"
          fi

          cat > .env <<EOF
          APP_ENV=${APP_ENV_VALUE:-development}
          ENABLE_DEV_TOOLS=${enable_dev_tools}
          AEGIS_HOST=${AEGIS_HOST_VALUE:-}
          AEGIS_PORT=${AEGIS_PORT_VALUE:-8888}
          AEGIS_CONNECT_TIMEOUT_SECONDS=${AEGIS_CONNECT_TIMEOUT_SECONDS_VALUE:-10}
          AEGIS_TRANSPORT_MASKING_KEY=${AEGIS_TRANSPORT_MASKING_KEY_VALUE:-}
          AEGIS_USE_TLS=${AEGIS_USE_TLS_VALUE:-false}
          AEGIS_APP_ID=${AEGIS_APP_ID_VALUE:-}
          AEGIS_APP_HASH=${AEGIS_APP_HASH_VALUE:-}
          EOF

      - name: Force regenerate code for build env
        run: |
          flutter gen-l10n
          dart build clean
          flutter pub upgrade build_runner
          rm -rf .dart_tool/build/
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify build env values are embedded
        shell: bash
        run: |
          if grep -q "static const String aegisHost = '';" lib/core/config/env.g.dart; then
            echo "::error::Generated env.g.dart still contains an empty AEGIS_HOST. Check GitHub secrets and the build env generation step."
            exit 1
          fi

      - name: Build Linux (debug)
        if: steps.meta.outputs.build_mode == 'debug' && matrix.platform == 'linux'
        run: flutter build linux --debug

      - name: Build Linux (release)
        if: steps.meta.outputs.build_mode == 'release' && matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Upload Linux artifact (debug)
        if: steps.meta.outputs.build_mode == 'debug' && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        id: upload_linux_debug
        with:
          name: twospace-linux-debug
          retention-days: 30
          path: build/linux/x64/debug/bundle

      - name: Upload Linux artifact (release)
        if: steps.meta.outputs.build_mode == 'release' && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        id: upload_linux_release
        with:
          name: twospace-linux-release
          retention-days: 30
          path: build/linux/x64/release/bundle

      - name: Summary (Linux debug)
        if: steps.meta.outputs.build_mode == 'debug' && matrix.platform == 'linux'
        run: |
          {
            echo "### Linux (debug)"
            echo "- Download (zip artifact): [twospace-linux-debug](${{ steps.upload_linux_debug.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (Linux release)
        if: steps.meta.outputs.build_mode == 'release' && matrix.platform == 'linux'
        run: |
          {
            echo "### Linux (release)"
            echo "- Download (zip artifact): [twospace-linux-release](${{ steps.upload_linux_release.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Windows portable bundle (debug)
        if: steps.meta.outputs.build_mode == 'debug' && matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build Windows portable bundle (release)
        if: steps.meta.outputs.build_mode == 'release' && matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Upload Windows portable artifact (debug)
        if: steps.meta.outputs.build_mode == 'debug' && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        id: upload_windows_preview
        with:
          name: twospace-windows-debug
          retention-days: 30
          path: build/windows/x64/runner/Release

      - name: Upload Windows portable artifact (release)
        if: steps.meta.outputs.build_mode == 'release' && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        id: upload_windows_release
        with:
          name: twospace-windows-release
          retention-days: 30
          path: build/windows/x64/runner/Release

      - name: Summary (Windows debug)
        if: steps.meta.outputs.build_mode == 'debug' && matrix.platform == 'windows'
        run: |
          "### Windows (debug)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Portable bundle: [twospace-windows-debug](${{ steps.upload_windows_preview.outputs.artifact-url }})" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        shell: pwsh

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Download Visual C++ Redistributable (Windows)
        if: matrix.platform == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Invoke-WebRequest -Uri https://aka.ms/vc14/vc_redist.x64.exe -OutFile dist/vc_redist.x64.exe
        shell: pwsh

      - name: Build Windows installer (Inno Setup)
        if: matrix.platform == 'windows'
        run: |
          $verLine = (Get-Content pubspec.yaml | Select-String -Pattern '^version:' | Select-Object -First 1).Line
          if (-not $verLine) { throw 'pubspec.yaml: version not found' }

          $ver = $verLine.Split(':', 2)[1].Trim()
          $verShort = $ver.Split('+')[0]
          $verCore = $verShort.Split('-')[0]
          $verBuild = if ($ver -match '\+(\d+)$') { $Matches[1] } else { '0' }
          $versionInfo = "$verCore.$verBuild"
          $suffix = if ('${{ steps.meta.outputs.build_mode }}' -eq 'debug') { '-debug' } else { '' }

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }

          & $iscc "/DMyAppVersion=$verShort" "/DMyVersionInfoVersion=$versionInfo" "/DMyOutputSuffix=$suffix" "/DMyBuildDir=build\\windows\\x64\\runner\\Release" "/DMyVcRedistPath=dist\\vc_redist.x64.exe" /Odist setup.iss

          $out = Get-ChildItem -Path dist -Filter '*_setup*_v*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $out) { throw 'Installer .exe not found in dist/' }
          Write-Host "Built installer: $($out.FullName)"
        shell: pwsh

      - name: Upload Windows installer artifact (debug)
        if: steps.meta.outputs.build_mode == 'debug' && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        id: upload_windows_installer_preview
        with:
          name: twospace-windows-installer-debug
          retention-days: 30
          path: dist/*_setup*-debug_v*.exe

      - name: Upload Windows installer artifact (release)
        if: steps.meta.outputs.build_mode == 'release' && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        id: upload_windows_installer_release
        with:
          name: twospace-windows-installer
          retention-days: 30
          path: dist/*_setup_v*.exe

      - name: Summary (Windows installer debug)
        if: steps.meta.outputs.build_mode == 'debug' && matrix.platform == 'windows'
        run: |
          "- Installer (.exe): [twospace-windows-installer-debug](${{ steps.upload_windows_installer_preview.outputs.artifact-url }})" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        shell: pwsh

      - name: Summary (Windows release)
        if: steps.meta.outputs.build_mode == 'release' && matrix.platform == 'windows'
        run: |
          "### Windows (release)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Portable bundle: [twospace-windows-release](${{ steps.upload_windows_release.outputs.artifact-url }})" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Installer (.exe): [twospace-windows-installer](${{ steps.upload_windows_installer_release.outputs.artifact-url }})" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        shell: pwsh
