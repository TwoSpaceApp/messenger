name: Build Desktop (Windows & Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.env.example'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.env.example'
      - '.github/workflows/build-desktop.yml'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libcurl4-openssl-dev \
            libc-ares-dev \
            libssl-dev \
            libgtk-3-dev \
            libsecret-1-dev \
            libasound2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            liblzma-dev

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Enable Linux desktop
        if: matrix.platform == 'linux'
        run: flutter config --enable-linux-desktop

      - name: Enable Windows desktop
        if: matrix.platform == 'windows'
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux (PR, debug)
        if: github.event_name == 'pull_request' && matrix.platform == 'linux'
        run: flutter build linux --debug

      - name: Upload Linux artifact (PR, debug)
        if: github.event_name == 'pull_request' && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        id: upload_linux_debug
        with:
          name: twospace-linux-debug
          retention-days: 30
          path: build/linux/x64/debug/bundle

      - name: Summary (Linux PR)
        if: github.event_name == 'pull_request' && matrix.platform == 'linux'
        run: |
          {
            echo "### Linux (debug)";
            echo "- Download (zip artifact): [twospace-linux-debug](${{ steps.upload_linux_debug.outputs.artifact-url }})";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Windows (PR, debug)
        if: github.event_name == 'pull_request' && matrix.platform == 'windows'
        run: flutter build windows --debug

      - name: Upload Windows artifact (PR, debug)
        if: github.event_name == 'pull_request' && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        id: upload_windows_debug
        with:
          name: twospace-windows-debug
          retention-days: 30
          path: build/windows/x64/runner/Debug

      - name: Summary (Windows PR)
        if: github.event_name == 'pull_request' && matrix.platform == 'windows'
        run: |
          "### Windows (debug)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Download (zip artifact): [twospace-windows-debug](${{ steps.upload_windows_debug.outputs.artifact-url }})" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        shell: pwsh

      - name: Build Linux (push/manual, release)
        if: github.event_name != 'pull_request' && matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Upload Linux artifact (push/manual, release)
        if: github.event_name != 'pull_request' && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        id: upload_linux_release
        with:
          name: twospace-linux-release
          retention-days: 30
          path: build/linux/x64/release/bundle

      - name: Summary (Linux release)
        if: github.event_name != 'pull_request' && matrix.platform == 'linux'
        run: |
          {
            echo "### Linux (release)";
            echo "- Download (zip artifact): [twospace-linux-release](${{ steps.upload_linux_release.outputs.artifact-url }})";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Windows (push/manual, release)
        if: github.event_name != 'pull_request' && matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Upload Windows artifact (push/manual, release)
        if: github.event_name != 'pull_request' && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        id: upload_windows_release
        with:
          name: twospace-windows-release
          retention-days: 30
          path: build/windows/x64/runner/Release

      - name: Summary (Windows release)
        if: github.event_name != 'pull_request' && matrix.platform == 'windows'
        run: |
          "### Windows (release)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Download (zip artifact): [twospace-windows-release](${{ steps.upload_windows_release.outputs.artifact-url }})" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        shell: pwsh
