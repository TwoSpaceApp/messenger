name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.env.example'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.env.example'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || 'debug' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare env for CI
        shell: bash
        run: |
          cat > .env <<EOF
          ENABLE_DEV_TOOLS=false
          APP_ENV=development
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          AEGIS_HOST=${{ secrets.AEGIS_HOST }}
          AEGIS_PORT=8888
          AEGIS_CONNECT_TIMEOUT_SECONDS=10
          AEGIS_TRANSPORT_MASKING_KEY=${{ secrets.AEGIS_TRANSPORT_MASKING_KEY }}
          EOF

      - name: Codegen (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Debug APK
        if: env.BUILD_MODE == 'debug'
        run: flutter build apk --debug

      - name: Upload Debug APK artifact
        if: env.BUILD_MODE == 'debug'
        uses: actions/upload-artifact@v4
        id: upload_android_debug
        with:
          name: twospace-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Summary (Android debug)
        if: env.BUILD_MODE == 'debug'
        run: |
          {
            echo "### Android (debug)";
            echo "- Download: [app-debug.apk](${{ steps.upload_android_debug.outputs.artifact-url }})";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Split APKs (Release)
        if: env.BUILD_MODE == 'release'
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts (Release)
        if: env.BUILD_MODE == 'release'
        uses: actions/upload-artifact@v4
        id: upload_android_apks
        with:
          name: twospace-android-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Build App Bundle (Release)
        if: env.BUILD_MODE == 'release'
        run: flutter build appbundle --release

      - name: Upload App Bundle artifact (Release)
        if: env.BUILD_MODE == 'release'
        uses: actions/upload-artifact@v4
        id: upload_android_aab
        with:
          name: twospace-android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Summary (Android release)
        if: env.BUILD_MODE == 'release'
        run: |
          {
            echo "### Android (release)";
            echo "- APKs (split per ABI): [twospace-android-release-apks](${{ steps.upload_android_apks.outputs.artifact-url }})";
            echo "- AAB: [app-release.aab](${{ steps.upload_android_aab.outputs.artifact-url }})";
          } >> "$GITHUB_STEP_SUMMARY"
