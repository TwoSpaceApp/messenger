name: Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare .env (CI)
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              printf "# Generated by CI\n" > .env
            fi
          fi

      # PR builds should not depend on repository secrets (signing keys, etc.).
      - name: Build Debug APK (PR)
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      - name: Upload Debug APK artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: twospace-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # Release artifacts for manual runs and pushes to main/master.
      - name: Build Split APKs (Release)
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts (Release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: twospace-android-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Build App Bundle (Release)
        if: github.event_name != 'pull_request'
        run: flutter build appbundle --release

      - name: Upload App Bundle artifact (Release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: twospace-android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
