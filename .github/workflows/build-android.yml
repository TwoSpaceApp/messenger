name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: release
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.env.example'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine build mode
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            build_mode="${{ inputs.build_mode }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && ( "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ) ]]; then
            build_mode="release"
          else
            build_mode="debug"
          fi

          echo "build_mode=${build_mode}" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Prepare validation env
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Regenerate code
        run: 
          dart build -d

      - name: Prepare build env from GitHub secrets
        shell: bash
        env:
          APP_ENV_VALUE: ${{ secrets.APP_ENV }}
          ENABLE_DEV_TOOLS_VALUE: ${{ secrets.ENABLE_DEV_TOOLS }}
          AEGIS_HOST_VALUE: ${{ secrets.AEGIS_HOST }}
          AEGIS_PORT_VALUE: ${{ secrets.AEGIS_PORT }}
          AEGIS_CONNECT_TIMEOUT_SECONDS_VALUE: ${{ secrets.AEGIS_CONNECT_TIMEOUT_SECONDS }}
          AEGIS_TRANSPORT_MASKING_KEY_VALUE: ${{ secrets.AEGIS_TRANSPORT_MASKING_KEY }}
          AEGIS_USE_TLS_VALUE: ${{ secrets.AEGIS_USE_TLS }}
          AEGIS_APP_ID_VALUE: ${{ secrets.AEGIS_APP_ID }}
          AEGIS_APP_HASH_VALUE: ${{ secrets.AEGIS_APP_HASH }}
        run: |
          if [[ -z "${AEGIS_HOST_VALUE}" ]]; then
            echo "::error::AEGIS_HOST secret is missing or unavailable for this workflow event. Android build artifacts are only produced for push/workflow_dispatch runs with repository secrets access."
            exit 1
          fi

          cat > .env <<EOF
          APP_ENV=${APP_ENV_VALUE:-development}
          ENABLE_DEV_TOOLS=${ENABLE_DEV_TOOLS_VALUE:-false}
          AEGIS_HOST=${AEGIS_HOST_VALUE:-}
          AEGIS_PORT=${AEGIS_PORT_VALUE:-8888}
          AEGIS_CONNECT_TIMEOUT_SECONDS=${AEGIS_CONNECT_TIMEOUT_SECONDS_VALUE:-10}
          AEGIS_TRANSPORT_MASKING_KEY=${AEGIS_TRANSPORT_MASKING_KEY_VALUE:-}
          AEGIS_USE_TLS=${AEGIS_USE_TLS_VALUE:-false}
          AEGIS_APP_ID=${AEGIS_APP_ID_VALUE:-}
          AEGIS_APP_HASH=${AEGIS_APP_HASH_VALUE:-}
          EOF

      - name: Force regenerate code for build env
        run: |
          flutter gen-l10n
          dart build clean
          dart build -d

      - name: Verify build env values are embedded
        shell: bash
        run: |
          if grep -q "static const String aegisHost = '';" lib/core/config/env.g.dart; then
            echo "::error::Generated env.g.dart still contains an empty AEGIS_HOST. Check GitHub secrets and the build env generation step."
            exit 1
          fi

      - name: Build Debug APK
        if: steps.meta.outputs.build_mode == 'debug'
        run: flutter build apk --debug

      - name: Upload Debug APK artifact
        if: steps.meta.outputs.build_mode == 'debug'
        uses: actions/upload-artifact@v4
        id: upload_android_debug
        with:
          name: twospace-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Summary (Android debug)
        if: steps.meta.outputs.build_mode == 'debug'
        run: |
          {
            echo "### Android (debug)"
            echo "- Download: [app-debug.apk](${{ steps.upload_android_debug.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Split APKs (Release)
        if: steps.meta.outputs.build_mode == 'release'
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts (Release)
        if: steps.meta.outputs.build_mode == 'release'
        uses: actions/upload-artifact@v4
        id: upload_android_apks
        with:
          name: twospace-android-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Build App Bundle (Release)
        if: steps.meta.outputs.build_mode == 'release'
        run: flutter build appbundle --release

      - name: Upload App Bundle artifact (Release)
        if: steps.meta.outputs.build_mode == 'release'
        uses: actions/upload-artifact@v4
        id: upload_android_aab
        with:
          name: twospace-android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Summary (Android release)
        if: steps.meta.outputs.build_mode == 'release'
        run: |
          {
            echo "### Android (release)"
            echo "- APKs (split per ABI): [twospace-android-release-apks](${{ steps.upload_android_apks.outputs.artifact-url }})"
            echo "- AAB: [app-release.aab](${{ steps.upload_android_aab.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"
